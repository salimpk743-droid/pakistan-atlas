<body>
  <div id="site-header"></div>
  <div class="page-hero"><div class="container">
    <p><a href="index.html" style="color:#fff">Home</a> · Districts</p>
    <h1>Find a district</h1>
    <p>Search by district, headquarters or province. Open a card to read the full page.</p>
  </div></div>
  <section>
    <div class="container">
      <div class="search">
        <label class="visually-hidden" for="q" style="position:absolute;left:-999px">Search districts</label>
        <input id="q" type="search" placeholder="Try Lahore, Swat, Gwadar, Peshawar…" autocomplete="off" enterkeyhint="search" />
      </div>
      <p class="search-count" id="count"></p>
      <div class="district-results" id="rows"></div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script>
    const PROVINCE_HREF = {
      ict: "islamabad-capital-territory.html",
      punjab: "punjab.html",
      kpk: "khyber-pakhtunkhwa.html",
      sindh: "sindh.html",
      balochistan: "balochistan.html",
      gb: "gilgit-baltistan.html",
      ajk: "azad-kashmir.html"
    };
    let rows = [];
    function draw(list) {
      document.getElementById("count").textContent = list.length
        ? list.length + " district" + (list.length === 1 ? "" : "s")
        : "No districts match that search.";
      document.getElementById("rows").innerHTML = list.map(d => `
        <a class="district-result" href="${d.slug}.html">
          <strong>${d.name}</strong>
          <span>${d.province} · HQ ${d.hq}</span>
        </a>`).join("");
    }
    loadDistricts().then(data => {
      rows = Object.values(data).flatMap(p =>
        (p.districts || []).map(d => ({
          slug: d.slug,
          name: d.name,
          hq: d.hq,
          province: p.name,
          hay: (d.name + " " + d.hq + " " + p.name + " " + (p.short || "")).toLowerCase()
        }))
      ).sort((a, b) => a.name.localeCompare(b.name));
      const params = new URLSearchParams(location.search);
      const start = params.get("q") || "";
      const input = document.getElementById("q");
      if (start) input.value = start;
      draw(filter(start));
      input.focus({ preventScroll: true });
    });
    function filter(q) {
      q = (q || "").trim().toLowerCase();
      return q ? rows.filter(d => d.hay.includes(q)) : rows;
    }
    document.addEventListener("input", e => {
      if (e.target.id !== "q") return;
      draw(filter(e.target.value));
    });
  </script>
