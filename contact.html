<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Pakistan Atlas</title>
  <meta name="description" content="Contact the editor of Pakistan Atlas with corrections, photos or questions." />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="page-hero"><div class="container">
    <h1>Contact</h1>
    <p>Corrections are welcome. Replace the email below with your real address before you apply for AdSense.</p>
  </div></div>
  <section>
    <div class="container" style="max-width:640px">
      <form class="prose" onsubmit="event.preventDefault(); alert('Connect this form to Formspree or your email host.');">
        <label>Name</label>
        <input required name="name" />
        <label>Email</label>
        <input required type="email" name="email" />
        <label>District or topic</label>
        <input name="topic" />
        <label>Message</label>
        <textarea required rows="6" name="message"></textarea>
        <button class="btn" type="submit">Send</button>
        <p style="margin-top:1rem">Direct email: <a href="mailto:editor@example.com">editor@example.com</a></p>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
