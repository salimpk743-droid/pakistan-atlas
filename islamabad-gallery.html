<body>
  <div id="site-header"></div>
  <div class="page-hero"><div class="container">
    <p style="opacity:.9"><a href="index.html" style="color:#fff">Home</a> · <a href="islamabad.html" style="color:#fff">Islamabad Capital Territory</a></p>
    <h1>Islamabad photo gallery</h1>
    <p>Photos credit: islamabadians</p>
  </div></div>
  <section>
    <div class="container">
      <p class="upload-note">All photographs on this page are published with credit to <strong>islamabadians</strong>. Click a picture to open it large on this page.</p>
      <div class="gallery-grid" id="grid"></div>
    </div>
  </section>
  <div class="lb" id="lb" role="dialog">
    <button type="button" id="lb-x" aria-label="Close">&times;</button>
    <img id="lb-img" alt="" />
    <p id="lb-cap"></p>
  </div>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/islamabad/init.js"></script>
  <script src="js/islamabad/load.js"></script>
  <script>
    (function(){
      var grid=document.getElementById('grid');
      var lb=document.getElementById('lb');
      var limg=document.getElementById('lb-img');
      var lcap=document.getElementById('lb-cap');
      function close(){ lb.classList.remove('on'); }
      var photos=window.ISB_PHOTOS||[];
      if(!photos.length){
        grid.innerHTML='<p>Higher-quality photos are being published. Refresh in a minute.</p>';
        return;
      }
      photos.forEach(function(p){
        var fig=document.createElement('figure');
        var a=document.createElement('a');
        a.href='#photo';
        var img=document.createElement('img');
        img.src=p.src; img.alt=p.alt;
        a.appendChild(img);
        a.addEventListener('click', function(e){
          e.preventDefault();
          limg.src=p.src; limg.alt=p.alt;
          lcap.textContent=p.cap+' Photos credit: islamabadians';
          lb.classList.add('on');
        });
        var cap=document.createElement('figcaption');
        cap.textContent=p.cap+' Photos credit: islamabadians';
        fig.appendChild(a); fig.appendChild(cap);
        grid.appendChild(fig);
      });
      document.getElementById('lb-x').addEventListener('click', close);
      lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
      document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
    })();
  </script>
</body>
