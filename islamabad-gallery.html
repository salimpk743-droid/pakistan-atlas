<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Islamabad photo gallery — Pakistan Atlas</title>
  <meta name="description" content="Islamabad photo gallery. Photographs of the capital’s roads, Faisal Mosque and Margalla views. Photo credit: islamabadians." />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .gallery-grid a{cursor:zoom-in}
    .gallery-grid img{width:100%;height:240px;object-fit:cover;display:block;background:#e8efe8}
    .lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;align-items:center;justify-content:center;padding:1.5rem;flex-direction:column}
    .lb.on{display:flex}
    .lb img{max-width:min(1200px,96vw);max-height:86vh;object-fit:contain;border-radius:8px}
    .lb p{color:#fff;margin:.75rem 0 0;text-align:center}
    .lb button{position:absolute;top:1rem;right:1rem;background:#fff;border:0;border-radius:999px;width:42px;height:42px;font-size:1.5rem;cursor:pointer}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <div class="page-hero"><div class="container">
    <p style="opacity:.9"><a href="index.html" style="color:#fff">Home</a> · <a href="province.html?id=ict" style="color:#fff">Islamabad Capital Territory</a></p>
    <h1>Islamabad photo gallery</h1>
    <p>Photos credit: islamabadians</p>
  </div></div>
  <section>
    <div class="container">
      <p class="upload-note">All photographs on this page are published with credit to <strong>islamabadians</strong>. Click a picture to open it large on this page.</p>
      <div class="gallery-grid" id="grid"></div>
    </div>
  </section>
  <div class="lb" id="lb" role="dialog">
    <button type="button" id="lb-x" aria-label="Close">&times;</button>
    <img id="lb-img" alt="" />
    <p id="lb-cap"></p>
  </div>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script>window.ISB_PHOTOS=[];</script>
  <script src="js/islamabad/photo1.js"></script>
  <script src="js/islamabad/photo2.js"></script>
  <script src="js/islamabad/photo3.js"></script>
  <script src="js/islamabad/photo4.js"></script>
  <script src="js/islamabad/photo5.js"></script>
  <script src="js/islamabad/photo6.js"></script>
  <script src="js/islamabad/photo7.js"></script>
  <script>
    (function(){
      var grid=document.getElementById('grid');
      var lb=document.getElementById('lb');
      var limg=document.getElementById('lb-img');
      var lcap=document.getElementById('lb-cap');
      function close(){ lb.classList.remove('on'); }
      (window.ISB_PHOTOS||[]).forEach(function(p){
        var fig=document.createElement('figure');
        var a=document.createElement('a');
        a.href='#';
        var img=document.createElement('img');
        img.src=p.src; img.alt=p.alt;
        a.appendChild(img);
        a.addEventListener('click', function(e){
          e.preventDefault();
          limg.src=p.src; limg.alt=p.alt;
          lcap.textContent=p.cap+' Photos credit: islamabadians';
          lb.classList.add('on');
        });
        var cap=document.createElement('figcaption');
        cap.textContent=p.cap+' Photos credit: islamabadians';
        fig.appendChild(a); fig.appendChild(cap);
        grid.appendChild(fig);
      });
      document.getElementById('lb-x').addEventListener('click', close);
      lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
      document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
    })();
  </script>
</body>
</html>
