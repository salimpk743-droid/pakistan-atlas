name: Audit HTML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails on: repeated generated blocks, stray ``` fences, truncated pages (missing </html>),
      # missing/incorrect canonicals, links to redirected URLs, invalid JSON-LD, missing static chrome,
      # duplicate titles/descriptions and a modified Search Console verification file.
      - name: Run HTML audit
        run: node scripts/audit-html.js

      - name: Audit internal links
        run: node scripts/audit-internal-links.js

      - name: Audit sitemap
        run: node scripts/audit-sitemap.js
