name: Generate sitemap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply known SEO fixes
        run: node scripts/fix-known-seo.js

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Audit HTML
        run: node scripts/audit-html.js

      - name: Audit internal links
        run: node scripts/audit-internal-links.js

      - name: Audit sitemap
        run: node scripts/audit-sitemap.js

      - name: Commit SEO fixes and sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml haveli.html islamabad.html sudhanoti.html politics.html latest-news.html current-affairs.html scripts/fix-known-seo.js scripts/audit-internal-links.js
          if git diff --cached --quiet; then
            echo "SEO files and sitemap are already up to date."
          else
            git commit -m "SEO: fix metadata and refresh sitemap"
            git push
          fi
