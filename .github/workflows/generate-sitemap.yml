name: Generate sitemap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so generate-sitemap.js can read each file's real last-commit date.
          fetch-depth: 0

      - name: Apply known SEO fixes
        run: node scripts/fix-known-seo.js

      - name: Regenerate SEO pages and canonical district links
        run: node scripts/generate-seo.js

      - name: Enhance district SEO and internal links
        run: node scripts/enhance-district-seo.js

      - name: Build static header, breadcrumbs, footer, AdSense tags, titles and structured data
        run: node scripts/build-site.js

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      # Audit before committing so broken output is never pushed.
      - name: Audit generated SEO files
        run: node scripts/audit-html.js

      - name: Audit internal links
        run: node scripts/audit-internal-links.js

      - name: Audit sitemap
        run: node scripts/audit-sitemap.js

      - name: Commit SEO fixes and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "SEO files and sitemap are already up to date."
          else
            git commit -m "Improve district SEO and internal linking"
            git push
          fi

      # Every step above must be idempotent: a second run on the committed output must change nothing.
      - name: Check the pipeline is idempotent
        run: |
          node scripts/fix-known-seo.js
          node scripts/generate-seo.js
          node scripts/enhance-district-seo.js
          node scripts/build-site.js
          node scripts/generate-sitemap.js
          git status --porcelain
          git diff --exit-code
