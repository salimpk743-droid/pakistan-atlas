name: Generate sitemap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Current News and Culture structure
        run: node scripts/migrate-news-culture.js

      - name: Apply known SEO fixes
        run: node scripts/fix-known-seo.js

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit SEO fixes and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml culture.html latest-news.html app.js js/app.js current-affairs.html haveli.html islamabad.html sudhanoti.html politics.html scripts/fix-known-seo.js scripts/generate-sitemap.js scripts/migrate-news-culture.js
          if git diff --cached --quiet; then
            echo "SEO files and sitemap are already up to date."
          else
            git commit -m "Fix Current News and Culture navigation"
            git push
          fi

      - name: Audit HTML
        run: node scripts/audit-html.js

      - name: Audit internal links
        run: node scripts/audit-internal-links.js

      - name: Audit sitemap
        run: node scripts/audit-sitemap.js
