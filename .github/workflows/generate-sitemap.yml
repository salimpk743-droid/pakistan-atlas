name: Generate sitemap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebrand site text and canonical host
        run: |
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.xml" -o -name "*.txt" -o -name "*.md" -o -name "*.json" \) -not -path "./.git/*" -print0 | xargs -0 sed -i -e "s/Pakistan Atlas/MyBook.Pk/g" -e "s/pakistan-atlas.vercel.app/mybook.pk/g"

      - name: Apply known SEO fixes
        run: node scripts/fix-known-seo.js

      - name: Regenerate SEO pages and canonical district links
        run: node scripts/generate-seo.js

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit SEO fixes and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "SEO files and sitemap are already up to date."
          else
            git commit -m "Fix homepage Current News and Culture cards"
            git push
          fi

      - name: Audit generated SEO files
        run: node scripts/audit-html.js

      - name: Audit internal links
        run: node scripts/audit-internal-links.js

      - name: Audit sitemap
        run: node scripts/audit-sitemap.js
