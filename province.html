<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Province — Pakistan Atlas</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="page-hero"><div class="container">
    <p id="crumb" style="opacity:.85;margin-bottom:.4rem"></p>
    <h1 id="title">Province</h1>
    <p id="intro"></p>
  </div></div>
  <section>
    <div class="container">
      <div id="layout" class="province-split single">
        <div>
          <div class="search"><input id="q" type="search" placeholder="Search a district in this province…" /></div>
          <div class="grid-3" id="cards"></div>
        </div>
        <aside id="ict-side" class="ict-gallery-panel" hidden>
          <a class="ict-gallery-btn" href="islamabad-gallery.html">Islamabad photo gallery</a>
          <p class="ict-credit">Photos credit: <strong>islamabadians</strong>. Click a picture to open it large.</p>
          <div class="ict-thumbs" id="ict-thumbs"></div>
        </aside>
      </div>
    </div>
  </section>
  <div class="lb" id="lb" role="dialog">
    <button type="button" id="lb-x" aria-label="Close">&times;</button>
    <img id="lb-img" alt="" />
    <p id="lb-cap"></p>
  </div>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/islamabad/init.js"></script>
  <script src="js/islamabad/load.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id") || "punjab";
    let all = [];
    function openPhoto(p){
      var lb=document.getElementById('lb');
      document.getElementById('lb-img').src=p.src;
      document.getElementById('lb-img').alt=p.alt||'';
      document.getElementById('lb-cap').textContent=(p.cap||p.alt||'')+' Photos credit: islamabadians';
      lb.classList.add('on');
    }
    function closePhoto(){ document.getElementById('lb').classList.remove('on'); }
    document.getElementById('lb-x').addEventListener('click', closePhoto);
    document.getElementById('lb').addEventListener('click', function(e){ if(e.target.id==='lb') closePhoto(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePhoto(); });
    function fillIctThumbs(){
      var box=document.getElementById('ict-thumbs');
      var photos=window.ISB_PHOTOS||[];
      box.innerHTML='';
      photos.forEach(function(p,i){
        var a=document.createElement('a');
        a.href='#photo';
        if(i===0 || i===photos.length-1) a.className='wide';
        var img=document.createElement('img');
        img.src=p.src; img.alt=p.alt||'';
        a.appendChild(img);
        a.addEventListener('click', function(e){ e.preventDefault(); openPhoto(p); });
        box.appendChild(a);
      });
    }
    fetch("data/districts.json").then(r => r.json()).then(db => {
      const p = db[id];
      if (!p) { document.getElementById("title").textContent = "Not found"; return; }
      document.title = p.name + " districts — Pakistan Atlas";
      document.getElementById("title").innerHTML = p.name + ' <span class="urdu">' + p.urdu + "</span>";
      document.getElementById("intro").textContent = p.intro + " Capital: " + p.capital + ".";
      document.getElementById("crumb").innerHTML = '<a href="index.html" style="color:#fff">Home</a> · ' + p.districts.length + " districts";
      all = p.districts;
      if (id === "ict") {
        document.getElementById("layout").classList.remove("single");
        document.getElementById("ict-side").hidden = false;
        document.getElementById("cards").className = "grid-2";
        fillIctThumbs();
      }
      draw(all);
    });
    function hrefFor(slug) {
      const pages = {
        islamabad: "islamabad.html", buner: "buner.html", swat: "swat.html", mardan: "mardan.html",
        bajur: "bajaur.html", bajaur: "bajaur.html", abbottabad: "abbottabad.html", bannu: "bannu.html",
        battagram: "battagram.html", charsadda: "charsadda.html", "chitral-lower": "lower-chitral.html",
        "lower-chitral": "lower-chitral.html", chitral: "lower-chitral.html", "chitral-upper": "upper-chitral.html",
        "upper-chitral": "upper-chitral.html", "dera-ismail-khan": "dera-ismail-khan.html", dikhan: "dera-ismail-khan.html",
        "di-khan": "dera-ismail-khan.html", hangu: "hangu.html", haripur: "haripur.html", karak: "karak.html",
        khyber: "khyber.html", kohat: "kohat.html", kurram: "kurram.html", "lakki-marwat": "lakki-marwat.html",
        lakki: "lakki-marwat.html", "dir-lower": "lower-dir.html", "lower-dir": "lower-dir.html",
        "kohistan-lower": "lower-kohistan.html", "lower-kohistan": "lower-kohistan.html", malakand: "malakand.html",
        mansehra: "mansehra.html", mohmand: "mohmand.html", nowshera: "nowshera.html", nwa: "north-waziristan.html",
        "north-waziristan": "north-waziristan.html", orakzai: "orakzai.html", peshawar: "peshawar.html",
        shangla: "shangla.html", swabi: "swabi.html", swa: "south-waziristan.html", "south-waziristan": "south-waziristan.html",
        tank: "tank.html", torghar: "torghar.html", "upper-dir": "upper-dir.html", "dir-upper": "upper-dir.html",
        "upper-kohistan": "upper-kohistan.html", "kohistan-upper": "upper-kohistan.html", "kolai-palas": "kolai-palas.html",
        allai: "allai.html", attock: "attock.html", bahawalnagar: "bahawalnagar.html", bahawalpur: "bahawalpur.html",
        bhakkar: "bhakkar.html", chakwal: "chakwal.html", chiniot: "chiniot.html", dgkhan: "dera-ghazi-khan.html",
        "dera-ghazi-khan": "dera-ghazi-khan.html", faisalabad: "faisalabad.html", gujranwala: "gujranwala.html",
        gujrat: "gujrat.html", hafizabad: "hafizabad.html", jhang: "jhang.html", jhelum: "jhelum.html",
        kasur: "kasur.html", khanewal: "khanewal.html", khushab: "khushab.html", lahore: "lahore.html", layyah: "layyah.html",
        "kolai-pallas": "kolai-palas.html", "bar-swat": "bar-swat.html", "upper-swat": "bar-swat.html"
      };
      return pages[slug] || ("district.html?p=" + id + "&d=" + slug);
    }
    function draw(list) {
      const photos=window.ISB_PHOTOS||[];
      const img = (id === "ict" && photos[0]) ? photos[0].src : ((id === "ict") ? "" : ("images/" + id + ".jpg"));
      document.getElementById("cards").innerHTML = list.map(d =>
        '<article class="card"><img src="' + img + '" alt="' + d.name + '" /><div class="card-body"><span class="badge">' + d.hq + '</span><h3>' + d.name + '</h3><p>' + d.about.slice(0, 140) + '…</p><p class="meta"><a href="' + hrefFor(d.slug) + '">Read this district →</a></p></div></article>'
      ).join("");
    }
    document.addEventListener("input", e => {
      if (e.target.id !== "q") return;
      draw(all.filter(d => (d.name + d.hq + d.about).toLowerCase().includes(e.target.value.toLowerCase())));
    });
  </script>
</body>
</html>
